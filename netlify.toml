[build]
  command = "node build.js --minify"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# ─── ASSET OPTIMISATION ────────────────────────────────
# Netlify runs its own CSS minifier as a second pass after
# build.js --minify, so the deployed bundle.css is as small
# as possible. HTML and JS minification are also enabled.
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = false   # bundling is already handled by build.js
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.js]
  bundle = false
  minify = true

# ─── LIGHTHOUSE ────────────────────────────────────────
# Runs a Lighthouse audit after every deploy and surfaces
# the scores in the Netlify deploy summary.
# Raise thresholds over time as the site improves.
# Set fail_deploy_on_score_thresholds = "true" to block
# deploys that fall below the values below.
[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [plugins.inputs.thresholds]
    performance    = 0.7
    accessibility  = 0.9
    best-practices = 0.9
    seo            = 0.9
