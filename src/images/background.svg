<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" preserveAspectRatio="xMidYMid slice">

  <!-- Canvas: near-black matching neutral-10 -->
  <rect width="1440" height="810" fill="#0B0D10"/>

  <!-- ── Focal bloom ─────────────────────────────────────────────
       Layered radial gradients approximate the glow at the
       convergence point without requiring SVG filter elements,
       which can silently fail when SVG is used as a CSS
       background-image in some browsers.                        -->
  <radialGradient id="bloom" cx="920" cy="480" r="260" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#F5A623" stop-opacity="0.30"/>
    <stop offset="30%"  stop-color="#F5A623" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="bloom-core" cx="920" cy="480" r="90" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#FFCC66" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
  </radialGradient>

  <ellipse cx="920" cy="480" rx="260" ry="180" fill="url(#bloom)"/>
  <ellipse cx="920" cy="480" rx="90"  ry="60"  fill="url(#bloom-core)"/>

  <!-- ── Wave lines ──────────────────────────────────────────────
       20 cubic bezier curves — no SVG filters used.
       Left y-range:  40 → 720  (full height, even spread)
       Right y-range: 280 → 780 (lower-right fan-out)
       Control points tightly clustered around focal (920, 480)
       to create sharp convergence.
       Colour: purple outer → gold centre → purple below.        -->
  <g fill="none">

    <!-- i=0  top -->
    <path d="M 0 40  C 506 445 994 464 1440 280" stroke="#5B21B6" stroke-width="0.75" opacity="0.80"/>
    <!-- i=1 -->
    <path d="M 0 76  C 506 448 994 466 1440 306" stroke="#6D28D9" stroke-width="0.75" opacity="0.82"/>
    <!-- i=2 -->
    <path d="M 0 112 C 506 451 994 468 1440 333" stroke="#7C3AED" stroke-width="0.80" opacity="0.84"/>
    <!-- i=3 -->
    <path d="M 0 147 C 506 454 994 471 1440 359" stroke="#8B5CF6" stroke-width="0.82" opacity="0.86"/>
    <!-- i=4 -->
    <path d="M 0 183 C 506 457 994 473 1440 385" stroke="#A855F7" stroke-width="0.85" opacity="0.88"/>
    <!-- i=5 -->
    <path d="M 0 219 C 506 459 994 475 1440 412" stroke="#C026D3" stroke-width="0.88" opacity="0.90"/>
    <!-- i=6 -->
    <path d="M 0 255 C 506 462 994 477 1440 438" stroke="#DB2777" stroke-width="0.90" opacity="0.92"/>
    <!-- i=7 -->
    <path d="M 0 291 C 506 465 994 480 1440 464" stroke="#E91E63" stroke-width="0.92" opacity="0.93"/>
    <!-- i=8 -->
    <path d="M 0 326 C 506 467 994 482 1440 491" stroke="#F43F5E" stroke-width="0.96" opacity="0.95"/>
    <!-- i=9 -->
    <path d="M 0 362 C 506 469 994 483 1440 517" stroke="#F97316" stroke-width="1.00" opacity="0.97"/>
    <!-- i=10  gold centre ★ -->
    <path d="M 0 398 C 506 472 994 485 1440 543" stroke="#F5A623" stroke-width="1.10" opacity="1.00"/>
    <!-- i=11  amber -->
    <path d="M 0 434 C 506 476 994 488 1440 570" stroke="#F59E0B" stroke-width="1.10" opacity="1.00"/>
    <!-- i=12 -->
    <path d="M 0 470 C 506 480 994 490 1440 596" stroke="#F97316" stroke-width="1.00" opacity="0.97"/>
    <!-- i=13 -->
    <path d="M 0 505 C 506 482 994 491 1440 622" stroke="#F43F5E" stroke-width="0.96" opacity="0.95"/>
    <!-- i=14 -->
    <path d="M 0 541 C 506 485 994 494 1440 648" stroke="#E91E63" stroke-width="0.92" opacity="0.93"/>
    <!-- i=15 -->
    <path d="M 0 577 C 506 488 994 496 1440 675" stroke="#DB2777" stroke-width="0.90" opacity="0.92"/>
    <!-- i=16 -->
    <path d="M 0 613 C 506 491 994 498 1440 701" stroke="#C026D3" stroke-width="0.88" opacity="0.90"/>
    <!-- i=17 -->
    <path d="M 0 648 C 506 494 994 500 1440 727" stroke="#A855F7" stroke-width="0.85" opacity="0.88"/>
    <!-- i=18 -->
    <path d="M 0 684 C 506 496 994 502 1440 754" stroke="#7C3AED" stroke-width="0.80" opacity="0.84"/>
    <!-- i=19  bottom -->
    <path d="M 0 720 C 506 499 994 504 1440 780" stroke="#6D28D9" stroke-width="0.75" opacity="0.80"/>

  </g>

</svg>
